# Mosquitto settings for SafeHome.
#
# Copy this file to:  C:\Program Files\mosquitto\mosquitto.conf
# (replace the existing file), then restart the Mosquitto service.
# See docs/CLIENT_SETUP.md for the full steps.

# Listen for the ESP32 and the phone on port 1883, on all network interfaces.
listener 1883 0.0.0.0

# Only people with a username and password can connect.
allow_anonymous false

# The file that holds the username and password, made with mosquitto_passwd.
password_file C:/Program Files/mosquitto/passwd
